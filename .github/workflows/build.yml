# WestPlay Italia: compila l'installer per Windows a ogni modifica del ramo "italia".
# Il risultato si scarica dalla scheda Actions → ultima esecuzione → Artifacts → "WestPlay-Italia-installer".
name: Compila WestPlay Italia

on:
  push:
    branches: [italia]
  workflow_dispatch:

jobs:
  # Le frasi del navigatore registrate con la voce italiana "Paola" di Piper (CC0): tools/voce.
  voce:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Elenco delle frasi
        run: node tools/voce/frasi.mts frasi.json

      - name: Frasi già registrate (se non sono cambiate)
        id: cache
        uses: actions/cache@v4
        with:
          path: voce
          key: voce-paola-${{ hashFiles('frasi.json', 'tools/voce/genera.py') }}

      - uses: actions/setup-python@v5
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          python-version: '3.11'

      - name: Registra con Piper
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install piper-tts
          base=https://huggingface.co/rhasspy/piper-voices/resolve/main/it/it_IT/paola/medium
          curl -sSfL -o paola.onnx "$base/it_IT-paola-medium.onnx"
          curl -sSfL -o paola.onnx.json "$base/it_IT-paola-medium.onnx.json"
          python tools/voce/genera.py frasi.json paola.onnx voce

      - uses: actions/upload-artifact@v4
        with:
          name: voce-paola
          path: voce
          if-no-files-found: error

  build:
    needs: voce
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: voce-paola
          path: ui/public/voce

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ui/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Pacchetti npm
        run: npm ci

      - name: Test interfaccia
        run: npm test --prefix ui -- --testTimeout=60000

      - name: Plugin del gioco e strumenti (Rust)
        run: cargo build --release --workspace

      - name: Installer (Tauri)
        run: npx --no-install tauri build --config app/tauri.release.conf.json --config app/tauri.italia.conf.json

      - uses: actions/upload-artifact@v4
        with:
          name: WestPlay-Italia-installer
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
